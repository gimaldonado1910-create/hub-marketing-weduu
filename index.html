<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Hub de Marketing Weduu</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface-sunken: #f1efe8;
    --ink: #17181c;
    --ink-muted: #5b5e68;
    --ink-faint: #93969f;
    --border: #e6e3da;
    --border-strong: #d7d3c7;
    --accent: #e08a1e;
    --accent-deep: #b96c0e;
    --accent-tint: #fbeed9;
    --accent-ink: #ffffff;
    --danger: #c1443a;
    --danger-tint: #fbe9e7;
    --shadow-sm: 0 1px 2px rgba(23,24,28,.05);
    --shadow-md: 0 10px 30px -14px rgba(23,24,28,.22);
    --radius: 12px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #131315;
      --surface: #1c1d21;
      --surface-sunken: #212226;
      --ink: #f1efe9;
      --ink-muted: #a5a8b0;
      --ink-faint: #6d707a;
      --border: #2b2c31;
      --border-strong: #3a3b41;
      --accent: #f0a53a;
      --accent-deep: #ffc370;
      --accent-tint: #382a12;
      --accent-ink: #1c1300;
      --danger: #e5695d;
      --danger-tint: #3a1f1a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #131315;
    --surface: #1c1d21;
    --surface-sunken: #212226;
    --ink: #f1efe9;
    --ink-muted: #a5a8b0;
    --ink-faint: #6d707a;
    --border: #2b2c31;
    --border-strong: #3a3b41;
    --accent: #f0a53a;
    --accent-deep: #ffc370;
    --accent-tint: #382a12;
    --accent-ink: #1c1300;
    --danger: #e5695d;
    --danger-tint: #3a1f1a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 10px 30px -14px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  h1, h2, h3, .display { font-family: "Poppins", -apple-system, sans-serif; text-wrap: balance; letter-spacing: -0.01em; margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", monospace; font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: inherit; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    border-radius: 100px; border: 1px solid transparent;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .12s ease, border-color .12s ease, opacity .12s ease;
    white-space: nowrap;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-deep); }
  .btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
  .btn-secondary:hover:not(:disabled) { background: var(--surface-sunken); }
  .btn-ghost { background: none; color: var(--ink-muted); }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-sunken); color: var(--ink); }
  .btn-danger { background: none; color: var(--danger); }
  .btn-danger:hover:not(:disabled) { background: var(--danger-tint); }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }

  /* ---------- Modal (usado no detalhe de Cases) ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(17,17,20,.42); backdrop-filter: blur(1px); display: flex; justify-content: flex-end; z-index: 60; animation: fadeIn .15s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay.center { align-items: center; justify-content: center; }
  .modal-box { width: 420px; max-width: 92vw; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 22px; }
  .modal-box h2 { font-size: 16px; margin-bottom: 8px; }
  .modal-box p { font-size: 13px; color: var(--ink-muted); margin: 0 0 18px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

  .read-field { display: flex; flex-direction: column; gap: 3px; }
  .read-field .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); font-weight: 600; }
  .read-field .v { font-size: 13.5px; }
  .read-field .v.muted { color: var(--ink-faint); font-style: italic; }
  .read-field a.v { color: var(--accent-deep); text-decoration: underline; text-underline-offset: 2px; }

  /* ============================================================
     HUB PÚBLICO — Central Institucional de Materiais e Comunicação
     Design system próprio: sempre claro, Poppins, preto/branco/laranja.
     Todas as classes usam o prefixo "hb-" para nunca colidir com o
     tema interno (dark/light) do portal de gestão do Marketing.
     ============================================================ */
  .hb {
    --hb-orange: #ff5a1f;
    --hb-orange-2: #ff7a45;
    --hb-black: #0b0b0c;
    --hb-ink: #171717;
    --hb-muted: #737373;
    --hb-line: #e8e8e8;
    --hb-soft: #f7f7f7;
    --hb-white: #ffffff;
    color-scheme: light;
    background: var(--hb-white);
    color: var(--hb-ink);
    font-family: "Poppins", -apple-system, "Segoe UI", sans-serif;
    font-weight: 400;
    line-height: 1.5;
    min-height: 100%;
  }
  .hb * { box-sizing: border-box; }
  .hb button, .hb input, .hb textarea, .hb select { font-family: inherit; }
  .hb a { color: inherit; text-decoration: none; }
  .hb h1, .hb h2, .hb h3, .hb h4 { font-weight: 600; margin: 0; color: var(--hb-black); }
  .hb p { margin: 0; }
  .hb img { max-width: 100%; display: block; }

  .hb-shell { display: flex; flex-direction: column; min-height: 100%; background: var(--hb-white); }

  /* ---------- header ---------- */
  .hb-header { position: sticky; top: 0; z-index: 30; background: var(--hb-white); border-bottom: 1px solid var(--hb-line); }
  .hb-header-inner { max-width: 1180px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 28px; }
  .hb-logo { display: flex; align-items: center; cursor: pointer; border: none; background: none; padding: 0; }
  .hb-logo img { height: 30px; width: auto; }
  .hb-nav { display: flex; align-items: center; gap: 4px; flex: 1; flex-wrap: wrap; }
  .hb-nav-link { background: none; border: none; cursor: pointer; padding: 9px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--hb-ink); }
  .hb-nav-link:hover { background: var(--hb-soft); }
  .hb-nav-link.active { background: var(--hb-black); color: var(--hb-white); }

  /* ---------- hero ---------- */
  .hb-hero { padding: 40px 28px 28px; }
  .hb-hero-inner { max-width: 900px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hb-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--hb-orange); background: #fff1ea; padding: 6px 14px; border-radius: 999px; }
  .hb-hero h1 { font-size: clamp(30px, 4.2vw, 46px); font-weight: 700; line-height: 1.12; letter-spacing: -.01em; }
  .hb-hero h1 span { color: var(--hb-orange); }
  .hb-hero-sub { font-size: 16px; color: var(--hb-muted); max-width: 620px; line-height: 1.6; }
  .hb-search { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; background: var(--hb-soft); border: 1px solid var(--hb-line); border-radius: 999px; padding: 6px 6px 6px 20px; margin-top: 6px; }
  .hb-search input { flex: 1; border: none; background: none; outline: none; font-size: 14.5px; color: var(--hb-ink); font-family: inherit; padding: 10px 0; }
  .hb-search input::placeholder { color: var(--hb-muted); }
  .hb-search-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--hb-orange); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .hb-search-btn:hover { background: var(--hb-orange-2); }

  /* ---------- tech banner ---------- */
  .hb-techband { margin: 0; background: var(--hb-black); line-height: 0; }
  .hb-techband-img { width: 100%; height: auto; display: block; }

  /* ---------- section shell ---------- */
  .hb-section { max-width: 1180px; margin: 0 auto; padding: 64px 28px; }
  .hb-section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .hb-section-head h2 { font-size: 26px; }
  .hb-section-head p { color: var(--hb-muted); font-size: 14px; margin-top: 6px; }

  /* ---------- 5-card "Nossos materiais" grid ---------- */
  .hb-cards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .hb-mcard { border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; gap: 34px; min-height: 168px; cursor: pointer; border: 1px solid var(--hb-line); background: var(--hb-white); transition: transform .15s ease; }
  .hb-mcard:hover { transform: translateY(-2px); }
  .hb-mcard.dark { background: var(--hb-black); border-color: var(--hb-black); }
  .hb-mcard-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--hb-soft); color: var(--hb-orange); }
  .hb-mcard.dark .hb-mcard-icon { background: rgba(255,255,255,.08); color: var(--hb-orange-2); }
  .hb-mcard-title { font-size: 15px; font-weight: 600; color: var(--hb-black); }
  .hb-mcard.dark .hb-mcard-title { color: #fff; }
  .hb-mcard-desc { font-size: 12px; color: var(--hb-muted); margin-top: 4px; line-height: 1.5; }
  .hb-mcard.dark .hb-mcard-desc { color: #a8a8ad; }

  /* ---------- mais acessados ---------- */
  .hb-files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .hb-file-card { border: 1px solid var(--hb-line); border-radius: 14px; overflow: hidden; background: var(--hb-white); display: flex; flex-direction: column; }
  .hb-file-preview { height: 120px; background: var(--hb-soft); display: flex; align-items: center; justify-content: center; color: var(--hb-muted); overflow: hidden; }
  .hb-file-preview img { width: 100%; height: 100%; object-fit: cover; }
  .hb-file-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .hb-file-name { font-size: 13.5px; font-weight: 600; color: var(--hb-black); }
  .hb-file-meta { font-size: 11.5px; color: var(--hb-muted); }
  .hb-file-dl { margin-top: auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px; border-radius: 8px; background: var(--hb-soft); color: var(--hb-black); font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; }
  .hb-file-dl:hover { background: var(--hb-line); }

  /* ---------- CTA banner ---------- */
  .hb-cta { background: var(--hb-black); border-radius: 20px; padding: 44px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; position: relative; overflow: hidden; }
  .hb-cta::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 85% 20%, rgba(255,90,31,.3), transparent 55%); }
  .hb-cta-text { position: relative; max-width: 520px; }
  .hb-cta-text h3 { color: #fff; font-size: 22px; margin-bottom: 8px; }
  .hb-cta-text p { color: #b9b9be; font-size: 14px; line-height: 1.6; }
  .hb-cta-btn { position: relative; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; background: var(--hb-orange); color: #fff; border: none; padding: 13px 24px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .hb-cta-btn:hover { background: var(--hb-orange-2); }

  /* ---------- FAQ ---------- */
  .hb-faq-list { display: flex; flex-direction: column; gap: 10px; max-width: 780px; }
  .hb-faq-cat { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--hb-orange); margin: 22px 0 10px; }
  .hb-faq-cat:first-child { margin-top: 0; }
  .hb-faq-item { border: 1px solid var(--hb-line); border-radius: 12px; overflow: hidden; background: var(--hb-white); }
  .hb-faq-q { width: 100%; text-align: left; background: none; border: none; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--hb-black); }
  .hb-faq-q svg { flex-shrink: 0; transition: transform .15s ease; color: var(--hb-muted); }
  .hb-faq-item.open .hb-faq-q svg { transform: rotate(180deg); }
  .hb-faq-a { padding: 0 18px 16px; font-size: 13.5px; color: var(--hb-muted); line-height: 1.6; }

  /* ---------- footer ---------- */
  .hb-footer { margin-top: auto; background: var(--hb-black); padding: 44px 28px 26px; }
  .hb-footer-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .hb-footer-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .hb-footer img { height: 24px; }
  .hb-footer-tag { color: #8b8b90; font-size: 12.5px; }
  .hb-footer-nav { display: flex; gap: 18px; flex-wrap: wrap; }
  .hb-footer-nav button { background: none; border: none; color: #b9b9be; font-size: 12.5px; cursor: pointer; padding: 0; }
  .hb-footer-nav button:hover { color: #fff; }
  .hb-footer-bottom { border-top: 1px solid #232326; padding-top: 18px; font-size: 11.5px; color: #6f6f74; }

  /* ---------- generic page header (sub-pages) ---------- */
  .hb-pagehead { background: var(--hb-soft); border-bottom: 1px solid var(--hb-line); padding: 40px 28px; }
  .hb-pagehead-inner { max-width: 1180px; margin: 0 auto; }
  .hb-pagehead h1 { font-size: 28px; }
  .hb-pagehead p { color: var(--hb-muted); font-size: 14px; margin-top: 8px; max-width: 640px; }
  .hb-crumb { font-size: 12.5px; color: var(--hb-muted); margin-bottom: 10px; }
  .hb-crumb button { background: none; border: none; color: var(--hb-muted); cursor: pointer; font-size: 12.5px; padding: 0; }
  .hb-crumb button:hover { color: var(--hb-black); }

  /* ---------- folder groups (Marca / Materiais) ---------- */
  .hb-group { margin-bottom: 40px; }
  .hb-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .hb-group-head h3 { font-size: 17px; }
  .hb-group-head .hb-count { font-size: 12px; color: var(--hb-muted); background: var(--hb-soft); padding: 3px 10px; border-radius: 999px; }
  .hb-do-dont { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 40px; }
  .hb-do-dont-card { border-radius: 14px; padding: 18px 20px; font-size: 13px; line-height: 1.7; }
  .hb-do-dont-card.pode { background: #eef9f0; border: 1px solid #cdeed3; }
  .hb-do-dont-card.naopode { background: #fdeeec; border: 1px solid #f6cdc7; }
  .hb-do-dont-card h4 { font-size: 13px; margin-bottom: 8px; }
  .hb-do-dont-card.pode h4 { color: #1e8a3d; }
  .hb-do-dont-card.naopode h4 { color: #c23b2c; }

  /* ---------- cases grid ---------- */
  .hb-cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .hb-case-card { border: 1px solid var(--hb-line); border-radius: 16px; overflow: hidden; background: var(--hb-white); display: flex; flex-direction: column; }
  .hb-case-media { height: 150px; background: var(--hb-soft); display: flex; align-items: center; justify-content: center; color: var(--hb-muted); overflow: hidden; }
  .hb-case-media img { width: 100%; height: 100%; object-fit: cover; }
  .hb-case-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .hb-case-cliente { font-size: 11.5px; font-weight: 600; color: var(--hb-orange); text-transform: uppercase; letter-spacing: .03em; }
  .hb-case-title { font-size: 15px; font-weight: 600; color: var(--hb-black); }
  .hb-case-desc { font-size: 12.5px; color: var(--hb-muted); line-height: 1.55; flex: 1; }
  .hb-case-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .hb-case-tag { font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--hb-soft); color: var(--hb-ink); }
  .hb-case-actions { display: flex; gap: 8px; margin-top: 4px; }
  .hb-case-actions button { flex: 1; padding: 9px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--hb-line); background: var(--hb-white); color: var(--hb-black); display: inline-flex; align-items: center; justify-content: center; gap:6px; }
  .hb-case-actions button:hover { background: var(--hb-soft); }
  .hb-case-admin-row { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }

  /* ---------- forms (Solicitar ao Marketing) ---------- */
  .hb-form-card { max-width: 640px; background: var(--hb-white); border: 1px solid var(--hb-line); border-radius: 18px; padding: 30px 32px; }
  .hb-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .hb-field label { font-size: 12.5px; font-weight: 600; color: var(--hb-ink); }
  .hb-field .hb-input, .hb-field select, .hb-field textarea { font-family: inherit; font-size: 13.5px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--hb-line); background: var(--hb-white); color: var(--hb-ink); outline: none; }
  .hb-field .hb-input:focus, .hb-field select:focus, .hb-field textarea:focus { border-color: var(--hb-orange); }
  .hb-field textarea { resize: vertical; min-height: 88px; }
  .hb-submit-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--hb-orange); color: #fff; border: none; padding: 12px 24px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .hb-submit-btn:hover { background: var(--hb-orange-2); }
  .hb-submit-btn:disabled { opacity: .6; cursor: default; }
  .hb-form-success { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 30px 10px; }
  .hb-form-success .hb-ok-icon { width: 52px; height: 52px; border-radius: 50%; background: #eef9f0; color: #1e8a3d; display: flex; align-items: center; justify-content: center; }

  /* ---------- misc ---------- */
  .hb-empty { text-align: center; padding: 50px 20px; color: var(--hb-muted); font-size: 13.5px; }
  .hb-btn-ghost-black { background:none; border:1px solid var(--hb-line); color:var(--hb-black); border-radius:999px; padding:8px 16px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .hb-btn-ghost-black:hover { background: var(--hb-soft); }

  @media (max-width: 980px) {
    .hb-cards-grid { grid-template-columns: repeat(2, 1fr); }
    .hb-do-dont { grid-template-columns: 1fr; }
    .hb-header-inner { gap: 14px; }
    .hb-nav { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
    .hb-nav::-webkit-scrollbar { display: none; }
    .hb-nav-link { flex-shrink: 0; }
  }
  @media (max-width: 620px) {
    .hb-cards-grid { grid-template-columns: 1fr; }
    .hb-header-inner { padding: 12px 16px; }
    .hb-hero { padding: 40px 16px 0; }
    .hb-section { padding: 44px 16px; }
    .hb-cta { padding: 30px 22px; flex-direction: column; align-items: flex-start; }
    .hb-form-card { padding: 22px 20px; }
  }

  /* ============================================================
     HUB PÚBLICO — TECH REFRESH 2026
     Camada visual adicional sem alterar a lógica do portal.
     ============================================================ */
  .hb {
    --hb-orange: #ff5b22;
    --hb-orange-2: #ff7b45;
    --hb-black: #08090b;
    --hb-ink: #121316;
    --hb-muted: #72757d;
    --hb-line: #e9e9ec;
    --hb-soft: #f6f6f7;
    --hb-white: #ffffff;
    --hb-shadow: 0 18px 60px rgba(8,9,11,.08);
    --hb-shadow-hover: 0 28px 80px rgba(8,9,11,.13);
    font-family: "Poppins", -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,91,34,.05), transparent 27%),
      #fff;
  }
  .hb, .hb button, .hb input, .hb textarea, .hb select { font-family:"Poppins",-apple-system,"Segoe UI",sans-serif; }

  .hb-header {
    background: rgba(255,255,255,.84);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid rgba(10,10,12,.07);
  }
  .hb-header-inner { max-width:1280px; padding:15px 32px; }
  .hb-logo img { height:32px; }
  .hb-nav { justify-content:flex-end; gap:6px; }

/* ============================== mock / real DB ============================== */
function makeMockCollection(store, listeners, path) {
  if (!store[path]) store[path] = {};
  if (!listeners[path]) listeners[path] = new Set();
  function notify() {
    const snap = snapshot();
    listeners[path].forEach(cb => cb(snap));
  }
  function snapshot() {
    const docs = Object.entries(store[path]).map(([id, data]) => ({ id, data: () => data, exists: true }));
    return { docs, size: docs.length, empty: docs.length === 0 };
  }
  return {
    onSnapshot(next) {
      listeners[path].add(next);
      Promise.resolve().then(() => next(snapshot()));
      return () => listeners[path].delete(next);
    },
    add(data) {
      const id = uid();
      store[path][id] = data;
      notify();
      return Promise.resolve({ id });
    },
    doc(id) {
      return {
        id,
        get() { return Promise.resolve({ id, exists: !!store[path][id], data: () => store[path][id] }); },
        set(data) { store[path][id] = data; notify(); return Promise.resolve(); },
        update(data) { store[path][id] = { ...(store[path][id]||{}), ...data }; notify(); return Promise.resolve(); },
        delete() { delete store[path][id]; notify(); return Promise.resolve(); },
      };
    },
  };
}
function createMockDB() {
  const store = {}, listeners = {};
  return { collection(path) { return makeMockCollection(store, listeners, path); } };
}

const DataContext = createContext(null);

function useCollection(dbRef, path) {
  const [rows, setRows] = useState(null);
  useEffect(() => {
    if (!dbRef) return;
    const unsub = dbRef.collection(path).onSnapshot(snap => {
      setRows(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, err => {
      console.error("useCollection error on", path, err);
      setRows([]);
    });
    return unsub;
  }, [dbRef, path]);
  return rows;
}

function dataUrlToBlob(dataUrl) {
  const commaIdx = dataUrl.indexOf(",");
  const meta = dataUrl.slice(0, commaIdx);
  const b64 = dataUrl.slice(commaIdx + 1);
  const mimeMatch = /data:([^;]+)/.exec(meta);
  const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
async function downloadDataUrl(dataUrl, filename) {
  if (!dataUrl) return;
  const name = filename || "arquivo";
  try {
    if (window.claude && window.claude.use) {
      const downloads = await window.claude.use("downloads");
      if (downloads) {
        const blob = dataUrlToBlob(dataUrl);
        await downloads.save({ filename: name, data: blob });
        return;
      }
    }
  } catch (e) { /* indisponível/recusado dentro do artifact: sem retry */ }
  if (!(window.claude && window.claude.use)) {
    try {
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch (e) { /* noop */ }
  }
}

const MARKETING_EMAIL = "marketing@weduu.com";
const SOLICITACAO_CATEGORIAS = ["Material institucional", "Sugestão de case", "Dúvida sobre a marca", "Outro"];

function HubSolicitar({ goHub }) {
  const [nome, setNome] = useState("");
  const [emailRetorno, setEmailRetorno] = useState("");
  const [area, setArea] = useState("");
  const [categoria, setCategoria] = useState("");
  const [prazo, setPrazo] = useState("");
  const [descricao, setDescricao] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    if (!nome.trim() || !descricao.trim()) return;
    setSending(true);

    try {
      const { db: dbRef } = await getDB();
      await dbRef.collection("solicitacoes").add({
        nome, area, categoria, prazo, descricao,
        email: emailRetorno,
        criadoEm: todayISO(),
      });
    } catch (err) { /* se o registro falhar, o e-mail abaixo continua funcionando */ }

    const linhas = [
      "Nome: " + nome,
      area && "Área: " + area,
      emailRetorno && "E-mail para retorno: " + emailRetorno,
      categoria && "Categoria: " + categoria,
      prazo && "Prazo desejado: " + formatBR(prazo, true),
      "",
      "Detalhes:",
      descricao,
    ].filter(Boolean).join("\n");
    const assunto = "Solicitação ao Marketing" + (categoria ? ": " + categoria : "");
    const mailto = "mailto:" + MARKETING_EMAIL + "?subject=" + encodeURIComponent(assunto) + "&body=" + encodeURIComponent(linhas);
    window.location.href = mailto;

    setSending(false);
    setSent(true);
  }

  return h(React.Fragment, null,
    h("div", { className:"hb-pagehead" }, h("div", { className:"hb-pagehead-inner" },
      h("h1", null, "Solicitar ao Marketing"), h("p", null, "Peça um material, sugira um case ou tire uma dúvida com o time."),
    )),
    h("div", { className:"hb-section" },
      sent ? h("div", { className:"hb-form-card" },
        h("div", { className:"hb-form-success" },
          h("div", { className:"hb-ok-icon" }, h(Icon, { name:"check", size:22 })),
          h("h3", null, "Quase lá"),
          h("p", { style:{color:"var(--hb-muted)", fontSize:13.5, lineHeight:1.6} },
            "Abrimos um e-mail para " + MARKETING_EMAIL + " com a sua solicitação já preenchida. É só conferir e enviar."
          ),
          h(Btn, { variant:"secondary", onClick:()=>{ setSent(false); setNome(""); setEmailRetorno(""); setArea(""); setCategoria(""); setPrazo(""); setDescricao(""); } }, "Enviar outra solicitação"),
        )
      ) :
      h("form", { className:"hb-form-card", onSubmit: handleSubmit },
        h("h3", null, "Conte o que você precisa"),
        h("p", { style:{color:"var(--hb-muted)", fontSize:13.5, lineHeight:1.6, margin:"10px 0 22px"} },
          "Preencha os campos abaixo. Ao enviar, abrimos um e-mail pronto para " + MARKETING_EMAIL + "."
        ),
        h("div", { className:"hb-field" },
          h("label", null, "Nome *"),
          h("input", { className:"hb-input", value:nome, onChange:e=>setNome(e.target.value), required:true, placeholder:"Seu nome" }),
        ),
        h("div", { className:"hb-field" },
          h("label", null, "Área"),
          h("input", { className:"hb-input", value:area, onChange:e=>setArea(e.target.value), placeholder:"Ex: Comercial, CS, Financeiro" }),
        ),
        h("div", { className:"hb-field" },
          h("label", null, "Seu e-mail para retorno"),
          h("input", { type:"email", className:"hb-input", value:emailRetorno, onChange:e=>setEmailRetorno(e.target.value), placeholder:"nome@weduu.com" }),
        ),
        h("div", { className:"hb-field" },
          h("label", null, "Categoria"),
          h("select", { className:"hb-input", value:categoria, onChange:e=>setCategoria(e.target.value) },
            h("option", { value:"" }, "Selecione"),
            SOLICITACAO_CATEGORIAS.map(c => h("option", { key:c, value:c }, c)),
          ),
        ),
        h("div", { className:"hb-field" },
          h("label", null, "Prazo desejado"),
          h("input", { type:"date", className:"hb-input", value:prazo, onChange:e=>setPrazo(e.target.value) }),
        ),
        h("div", { className:"hb-field" },
          h("label", null, "Detalhes *"),
          h("textarea", { className:"hb-input", value:descricao, onChange:e=>setDescricao(e.target.value), required:true, rows:4, placeholder:"Descreva o que você precisa, com o máximo de detalhes possível." }),
        ),
        h("button", { type:"submit", className:"hb-submit-btn", disabled:sending }, h(Icon,{name:"send",size:15}), sending ? "Abrindo e-mail..." : "Enviar solicitação"),
      )
    ),
    h(HubFooter, { goHub }),
  );
}

const ALLOWED_MARKETING_USERS = ["giovana.maldonado", "bruno.fava", "theo.kayser"];
const MARKETING_PASSWORD = "thunderforce";
const ALLOWED_PORTAVOZ_USERS = { "lucimara.trigo": "Lucimara Trigo", "pricila.ribas": "Pricila Ribas" };
const PORTAVOZ_PASSWORD = "comercial2026";

function userInitials(username) {
  return username
    .split(".")
    .filter(Boolean)
    .map(p => p.charAt(0).toUpperCase())
    .slice(0,2)
    .join("");
}

function LoginModal({ onClose, onSuccess }) {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  function submit(e) {
    e.preventDefault();
    const normalized = username.trim().toLowerCase();

    if (ALLOWED_MARKETING_USERS.includes(normalized) && password === MARKETING_PASSWORD) {
      setError("");
      onSuccess(normalized, "marketing");
      return;
    }
    if (ALLOWED_PORTAVOZ_USERS[normalized] && password === PORTAVOZ_PASSWORD) {
      setError("");
      onSuccess(normalized, "portavoz");
      return;
    }
    setError("Usuário ou senha incorretos. Verifique os dados e tente novamente.");
  }

  return h("div", {
      className:"hb-login-overlay",
      onMouseDown:e=>{ if(e.target===e.currentTarget) onClose(); }
    },
    h("div", { className:"hb-login-card", role:"dialog", "aria-modal":"true", "aria-label":"Login do Marketing Interno" },
      h("div", { className:"hb-login-head" },
        h("div", null,
          h("img", { src:WEDUU_LOGO, alt:"Weduu", className:"hb-login-logo" }),
          h("h2", { className:"hb-login-title" }, "Acessar área interna"),

function InternalV3({ username, onReturn }) {
  const [internalHtml, setInternalHtml] = useState("");
  const iframeRef = useRef(null);

  useEffect(() => {
    try {
      const binary = atob(INTERNAL_V3_B64);
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      let html = new TextDecoder("utf-8").decode(bytes);
    const firstNames = {
      "bruno.fava": "Bruno",
      "theo.kayser": "Theo",
      "giovana.maldonado": "Giovana"
    };
    const firstName = firstNames[username] || (username.split(".")[0] || "").replace(/^./, c => c.toUpperCase());
      html = html.replaceAll("__WEDUU_USER__", username);
    html = html.replaceAll("__WEDUU_FIRSTNAME__", firstName);
      html = html.replaceAll("__WEDUU_INITIALS__", userInitials(username));
      setInternalHtml(html);
    } catch (err) {
      console.error("Erro ao carregar Marketing Interno:", err);
    }
  }, [username]);

  useEffect(() => {
    const handler = event => {
      if (event.data && event.data.type === "weduu-return-public") onReturn();
    };
    window.addEventListener("message", handler);
    return () => window.removeEventListener("message", handler);
  }, [onReturn]);

  // Ponte de banco de dados compartilhado: o Marketing Interno roda num iframe
  // isolado (srcDoc) e não tem acesso direto a window.claude.use("db"). Ele envia
  // pedidos via postMessage e esta camada, que roda na janela de cima (com acesso
  // real ao banco), executa a operação e responde.
  useEffect(() => {
    function handleDbMsg(event) {
      const d = event.data;
      if (!d || d.__weduuDbReq !== true) return;
      const { reqId, op, collection: col, payload } = d;
      const reply = (ok, result, error) => {
        try {
          const win = iframeRef.current && iframeRef.current.contentWindow;
          if (win) win.postMessage({ __weduuDbRes: true, reqId, ok, result, error }, "*");
        } catch (e) { /* ignore */ }
      };
      (async () => {
        try {
          const { db } = await getDB();
          const c = db.collection(col);
          if (op === "list") {
            const snap = await new Promise(resolve => {
              const unsub = c.onSnapshot(s => { if (unsub) unsub(); resolve(s); });
            });
            reply(true, snap.docs.map(x => ({ id: x.id, ...x.data() })));
          } else if (op === "add") {
            const ref = await c.add(payload);
            reply(true, { id: ref.id });
          } else if (op === "set") {
            await c.doc(payload.id).set(payload.data);
            reply(true, { ok: true });
          } else if (op === "update") {
            await c.doc(payload.id).update(payload.data);
            reply(true, { ok: true });
          } else if (op === "delete") {
            await c.doc(payload.id).delete();
            reply(true, { ok: true });
          } else {
            reply(false, null, "operação desconhecida: " + op);
          }
        } catch (err) {
          reply(false, null, String((err && err.message) || err));
        }
      })();
    }
    window.addEventListener("message", handleDbMsg);
    return () => window.removeEventListener("message", handleDbMsg);
  }, []);

  return h("div", { className:"weduu-internal-shell" },
    internalHtml
      ? h("iframe", {
          ref: iframeRef,
          className:"weduu-internal-frame",
          title:"Hub de Marketing Interno Weduu",
          srcDoc:internalHtml
        })
      : h("div", {
          style:{display:"grid",placeItems:"center",height:"100%",fontFamily:"Poppins,sans-serif",color:"#666"}
        }, "Carregando Marketing Interno…")
  );
}


function PublicHub({ onLogin }) {
  const [hubRoute, setHubRoute] = useState("home");
  const [pendingScroll, setPendingScroll] = useState(null);
  function goHub(r, scrollTo) {
    if (scrollTo) {
      if (hubRoute === "home") {
        const el = document.getElementById(scrollTo);
        if (el) el.scrollIntoView({ behavior:"smooth" }); else window.scrollTo(0,0);
      } else {
        setHubRoute("home");
        setPendingScroll(scrollTo);
      }
      return;
    }
    setHubRoute(r);
    window.scrollTo(0,0);
  }
  useEffect(() => {
    if (hubRoute==="home" && pendingScroll) {
      const el = document.getElementById(pendingScroll);
      if (el) el.scrollIntoView({ behavior:"smooth" });
      setPendingScroll(null);
    }
  }, [hubRoute, pendingScroll]);
  return h("div", { className:"hb" },
    h("div", { className:"hb-shell" },
      h(HubHeader, { hubRoute, goHub, onLogin }),
      hubRoute==="home" ? h(HubHome, { goHub }) :
      hubRoute==="marca" ? h(HubMarca, { goHub }) :
      hubRoute==="cases" ? h(HubCases, { goHub }) :
      hubRoute==="materiais" ? h(HubMateriais, { goHub }) :
      hubRoute==="divulgacao" ? h(HubDivulgacao, { goHub }) :
      hubRoute==="solicitar" ? h(HubSolicitar, { goHub }) :
      hubRoute==="ajuda" ? h(HubAjuda, { goHub }) : null,
    ),
  );
}

function ApvStatusPill({ status }) {
  return h("span", { className:"apv-status-pill apv-status-"+status }, h("span", { className:"apv-dot" }), APV_STATUS_LABEL[status]);
}

function ApprovalCard({ post, onOpen }) {
  const aprovStatus = post.aprovacaoStatus || "pendente";
  const imgs = (post.images && post.images.length) ? post.images : (post.imageUrl ? [post.imageUrl] : []);
  return h("div", { className:"apv-card", onClick:onOpen },
    h("div", { className:"apv-card-media" },
      h("span", { className:"apv-card-platform" }, post.platform || "Post"),
      imgs.length
        ? h(React.Fragment, null,
            h("img", { src: imgs[0], alt: "" }),
            imgs.length > 1 ? h("span", { className:"apv-card-count" }, "1/"+imgs.length) : null
          )
        : "Pré-visualização do material"
    ),
    h("div", { className:"apv-card-body" },
      post.publicadoPortaVoz
        ? h("span", { className:"apv-status-pill apv-status-publicado" }, h("span", { className:"apv-dot" }), "Publicado")
        : h(ApvStatusPill, { status:aprovStatus }),
      h("div", { className:"apv-card-title" }, post.title),
      h("div", { className:"apv-card-brief" }, post.brief || "Sem descrição."),
      h("button", { type:"button", className:"apv-card-open", onClick:e=>{ e.stopPropagation(); onOpen(); } }, "Ver post completo →"),
    )
  );
}

function ApprovalDetailModal({ post, onClose, onAprovar, onAjuste, onTogglePublicado, onComentar }) {
  const [comentario, setComentario] = useState("");
  const [imgIdx, setImgIdx] = useState(0);
  useEffect(() => { setImgIdx(0); }, [post.id]);
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  function enviar() {
    const texto = comentario.trim();
    if (!texto) return;
    onComentar(texto);
    setComentario("");
  }
  const aprovStatus = post.aprovacaoStatus || "pendente";
  const comentarios = post.comentariosAprovacao || [];
  const imgs = (post.images && post.images.length) ? post.images : (post.imageUrl ? [post.imageUrl] : []);
  function navImg(dir) {
    if (imgs.length < 2) return;
    setImgIdx(i => (i + dir + imgs.length) % imgs.length);
  }
  return h("div", {
      className:"apv-modal-overlay",
      onMouseDown:e=>{ if(e.target===e.currentTarget) onClose(); }
    },
    h("div", { className:"apv-modal" },
      h("div", { className:"apv-modal-media" },
        imgs.length
          ? h(React.Fragment, null,
              h("img", { src: imgs[imgIdx], alt: "" }),
              imgs.length > 1 ? h(React.Fragment, null,
                h("button", { type:"button", className:"apv-modal-nav prev", onClick:e=>{ e.stopPropagation(); navImg(-1); } }, "‹"),
                h("button", { type:"button", className:"apv-modal-nav next", onClick:e=>{ e.stopPropagation(); navImg(1); } }, "›"),
                h("div", { className:"apv-modal-dots" }, imgs.map((_,i) => h("span", { key:i, className: i===imgIdx ? "on" : "" }))),
                h("span", { className:"apv-modal-count" }, (imgIdx+1)+"/"+imgs.length)
              ) : null
            )
          : "Sem imagem"
      ),
      h("div", { className:"apv-modal-body" },
        h("div", { className:"apv-modal-head" },
          post.publicadoPortaVoz
            ? h("span", { className:"apv-status-pill apv-status-publicado" }, h("span", { className:"apv-dot" }), "Publicado")
            : h(ApvStatusPill, { status:aprovStatus }),
          h("button", { className:"apv-modal-close", type:"button", onClick:onClose, title:"Fechar" }, "×"),
        ),
        h("div", { className:"apv-modal-title" }, post.title),
        h("div", { className:"apv-modal-meta" }, post.platform || "Post"),
        h("div", { className:"apv-modal-brief" }, post.brief || "Sem descrição."),
        h("div", { className:"apv-card-actions" },
          h("button", { className:"apv-btn-aprovar", disabled: aprovStatus==="aprovado", onClick:onAprovar }, aprovStatus==="aprovado" ? "Aprovado ✓" : "Aprovar"),
          h("button", { className:"apv-btn-ajuste", onClick:onAjuste }, "Solicitar ajuste"),
          h("button", { className:"apv-btn-publicado "+(post.publicadoPortaVoz?"on":""), disabled: aprovStatus!=="aprovado", onClick:onTogglePublicado }, post.publicadoPortaVoz ? "Publicado ✓" : "Marcar como publicado"),
        ),
        h("div", { className:"apv-comments" },
          comentarios.length
            ? comentarios.map((c,i) => h("div", { className:"apv-comment", key:i }, h("b", null, c.autor), c.texto))
            : h("div", { className:"apv-comment-empty" }, "Nenhum comentário ainda."),
          h("div", { className:"apv-comment-form" },
            h("input", { placeholder:"Escrever um comentário…", value:comentario, onChange:e=>setComentario(e.target.value), onKeyDown:e=>{ if(e.key==="Enter") enviar(); } }),
            h("button", { onClick:enviar }, "Enviar"),
          )
        )
      )
    )
  );
}

function ApprovalApp({ username, dbRef, onReturn }) {
  const [tab, setTab] = useState("Pricila Ribas");
  const [openId, setOpenId] = useState(null);
  const nome = ALLOWED_PORTAVOZ_USERS[username] || username;
  const conteudos = useCollection(dbRef, "conteudos");

  const listaPricila = (conteudos||[]).filter(c => c.category==="Post" && c.portaVoz==="Pricila Ribas");
  const listaLucimara = (conteudos||[]).filter(c => c.category==="Post" && c.portaVoz==="Lucimara Trigo");
  const lista = tab==="Pricila Ribas" ? listaPricila : listaLucimara;
  const openPost = openId ? (conteudos||[]).find(c => c.id===openId) || null : null;

  function salvar(id, patch) {
    if (!dbRef) return;
    dbRef.collection("conteudos").doc(id).update(patch).catch(()=>{});
  }
  function aprovar(c) { salvar(c.id, { aprovacaoStatus:"aprovado" }); }
  function ajuste(c) { salvar(c.id, { aprovacaoStatus:"ajustes" }); }
  function togglePublicado(c) {
    const next = !c.publicadoPortaVoz;
    const patch = { publicadoPortaVoz: next };
    if (next) patch.status = "Publicado";
    salvar(c.id, patch);
  }
  function comentar(c, texto) {
    const novos = [...(c.comentariosAprovacao||[]), { autor:nome, texto, data:new Date().toISOString() }];
    salvar(c.id, { comentariosAprovacao: novos });
  }

  return h("div", { className:"hb" },
    h("div", { className:"hb-shell" },
    h("div", { className:"apv-top" },
      h("div", { className:"apv-top-left" },
        h("img", { src:WEDUU_LOGO, alt:"Weduu" }),
        h("div", { className:"apv-top-title" }, "Aprovação de Conteúdo", h("small", null, "Área de porta-vozes")),
      ),
      h("div", { className:"apv-top-right" },
        h("div", { className:"apv-user-chip" }, h("div", { className:"apv-user-badge" }, userInitials(username)), nome),
        h("button", { className:"apv-logout-btn", onClick:onReturn }, "Sair"),
      )
    ),
    h("div", { className:"apv-main" },
      h("div", { className:"apv-eyebrow" }, "Porta-vozes · Weduu"),
      h("h1", null, "Conteúdos para aprovação"),
      h("p", { className:"apv-sub" }, "Revise, comente e aprove os conteúdos preparados pelo time de Marketing. Depois de publicar por conta própria, marque o post como \"Publicado\"."),
      h("div", { className:"apv-tabs" },
        h("button", { className:"apv-tab-btn "+(tab==="Pricila Ribas"?"active":""), onClick:()=>setTab("Pricila Ribas") }, "Conteúdos da Pricila", h("span", { className:"apv-tab-count" }, listaPricila.length)),
        h("button", { className:"apv-tab-btn "+(tab==="Lucimara Trigo"?"active":""), onClick:()=>setTab("Lucimara Trigo") }, "Conteúdos da Lucimara", h("span", { className:"apv-tab-count" }, listaLucimara.length)),
      ),
      conteudos === null
        ? h("div", { className:"apv-empty-state" }, "Carregando conteúdos…")
        : lista.length
          ? h("div", { className:"apv-cards" }, lista.map(c => h(ApprovalCard, {
              key:c.id, post:c,
              onOpen:()=>setOpenId(c.id),
            })))
          : h("div", { className:"apv-empty-state" }, "Nenhum conteúdo classificado para aprovação ainda."),
    ),
    openPost && h(ApprovalDetailModal, {
      post:openPost,
      onClose:()=>setOpenId(null),
      onAprovar:()=>aprovar(openPost),
      onAjuste:()=>ajuste(openPost),
      onTogglePublicado:()=>togglePublicado(openPost),
      onComentar:texto=>comentar(openPost,texto),
    })
    )
  );
}

function App() {
  const [dbState, setDbState] = useState(null);
  const [loginOpen, setLoginOpen] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [currentPortaVoz, setCurrentPortaVoz] = useState(null);

  useEffect(() => { getDB().then(setDbState); }, []);

  useEffect(() => {
    const saved = sessionStorage.getItem("weduuMarketingUser");
    if (saved && ALLOWED_MARKETING_USERS.includes(saved)) setCurrentUser(saved);
    const savedPv = sessionStorage.getItem("weduuPortaVoz");
    if (savedPv && ALLOWED_PORTAVOZ_USERS[savedPv]) setCurrentPortaVoz(savedPv);
  }, []);

  const dbRef = dbState?.db;
  const uploads = useCollection(dbRef, "internal_uploads");

  const ctx = { uploads };
  const ready = uploads !== null;

  function loginSuccess(username, role) {
    if (role === "portavoz") {
      sessionStorage.setItem("weduuPortaVoz", username);
      setCurrentPortaVoz(username);
    } else {
      sessionStorage.setItem("weduuMarketingUser", username);
      setCurrentUser(username);
    }
    setLoginOpen(false);
  }

  function returnToPublic() {
    setCurrentUser(null);
    setCurrentPortaVoz(null);
    sessionStorage.removeItem("weduuMarketingUser");
    sessionStorage.removeItem("weduuPortaVoz");
    window.scrollTo(0,0);
  }

  if (currentUser) {
    return h(InternalV3, { username:currentUser, onReturn:returnToPublic });
  }

  if (currentPortaVoz) {
    return h(ApprovalApp, { username:currentPortaVoz, dbRef, onReturn:returnToPublic });
  }

  return h(DataContext.Provider, { value:ctx },
    !ready
      ? h("div", { className:"hb", style:{padding:60,color:"var(--hb-muted)",fontSize:13} }, "Carregando o hub…")
      : h(React.Fragment, null,
            h(PublicHub, { onLogin:()=>setLoginOpen(true) }),
            loginOpen ? h(LoginModal, { onClose:()=>setLoginOpen(false), onSuccess:loginSuccess }) : null
          )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));
</script>
